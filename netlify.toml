# Netlify deployment for Beat the Bot: The 40ms Market.
#
# A static single-page build, plus Netlify Functions backing the player registration and the
# leaderboard.
#
# Required environment variables, both SERVER-ONLY — neither is prefixed `VITE_`, so neither
# can reach the browser bundle:
#
#   NETLIFY_DB_URL            injected automatically once a database is attached to the project
#   LEADERBOARD_ADMIN_TOKEN   set by hand; gates /admin/leaderboard
#
# See README → "Environment variables". Nothing here is a secret the client needs.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # `@netlify/database` requires Node >= 22.12, and the functions import the game's own pure
  # scoring modules straight out of `src/`, which esbuild bundles alongside them.
  node_bundler = "esbuild"
  directory = "netlify/functions"

[build.environment]
  # Bumped from 20 for @netlify/database's engine requirement.
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────── SPA fallback
#
# Every unmatched path serves the app rather than a 404, so a shared or mistyped link still
# lands on the game. This is why `base` in vite.config.ts must stay '/' — with a relative base
# the bundle would be requested against the visitor's URL and the app would not boot here.
#
# force = false so real files (the brand assets, the JS and CSS bundles) are served first and
# only genuinely missing paths fall through to the app.
#
# The functions declare their own paths (`/api/*`, `/admin/leaderboard`) in each file's exported
# `config`, and Netlify matches those before this catch-all — so a leaderboard request is never
# answered with the SPA's HTML.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ────────────────────────────────────────────────────────────────── headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The game reads no sensors, location, camera or payment APIs.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Hashed bundles are immutable, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The brand marks keep their filenames across deploys, so they get a shorter cache.
[[headers]]
  for = "/brands/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Player data is per-request and must never sit in a shared cache.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

# The private administration page: never cached, never indexed, never in a referrer.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
